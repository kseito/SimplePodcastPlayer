name: Build Check (Android)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up build environment
      uses: ./.github/actions/setup-build-env

    - name: Build Android Debug
      run: ./gradlew :androidApp:assembleDebug