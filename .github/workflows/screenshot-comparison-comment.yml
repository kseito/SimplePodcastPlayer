name: Screenshot Comparison Comment

# screenshot-comparison.yml の完了後に実行され、差分画像を companion ブランチへ push して
# PR にスクリーンショット比較結果をコメントする。差分が解消したらコメントを削除する。
# workflow_run は書き込み権限を持つため、PR の成果物を未信頼データとして検証する。

on:
  # Required to comment on fork PRs. Only trusted main code runs; artifacts are isolated and validated.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Screenshot Comparison
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  comment:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'

    timeout-minutes: 5

    permissions:
      actions: read # artifact のダウンロード用
      contents: write # companion ブランチへの push 用
      pull-requests: write # PR へのコメント用

    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Resolve and validate pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 .github/scripts/screenshot_report.py

      - name: Download comparison results
        if: steps.pr.outputs.number != ''
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: screenshot-diff-reports
          path: ${{ runner.temp }}/screenshot-input

      - name: Publish comparison images
        id: report
        if: steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export LC_ALL=C
          source="$RUNNER_TEMP/screenshot-input"
          list="$RUNNER_TEMP/screenshot-files"
          body="$RUNNER_TEMP/screenshot-comment.md"
          [[ -d "$source" && ! -L "$source" ]]
          find "$source" -type f -name '*_compare.png' -print0 > "$list"
          if [[ ! -s "$list" ]]; then
            echo 'has_images=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="companion_pr_${PR_NUMBER}_run_${RUN_ID}"
          git checkout --orphan "$branch"
          git rm -rf --ignore-unmatch .
          printf '## Screenshot Comparison Results\n\n' > "$body"
          while IFS= read -r -d '' file; do
            relative="${file#"$source"/}"
            # Allow only URL-safe components, with no hidden or traversal components.
            if [[ ! "$relative" =~ ^([A-Za-z0-9_][A-Za-z0-9_.-]*/)*[A-Za-z0-9_][A-Za-z0-9_.-]*_compare\.png$ ]]; then
              echo 'Invalid screenshot path' >&2
              exit 1
            fi
            target="screenshots/$relative"
            mkdir -p -- "${target%/*}"
            cp -- "$file" "$target"
            git add -- "$target"
            printf '![](https://github.com/%s/blob/%s/%s?raw=true)\n' \
              "$GITHUB_REPOSITORY" "$branch" "$target" >> "$body"
          done < "$list"
          git -c user.name='github-actions[bot]' \
            -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'Add screenshot diff'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch" --force
          echo 'has_images=true' >> "$GITHUB_OUTPUT"

      - name: Find Comment
        if: steps.pr.outputs.number != ''
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        id: fc
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Screenshot Comparison Results

      - name: Add or update comment on PR
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        if: steps.report.outputs.has_images == 'true'
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ steps.pr.outputs.number }}
          body-path: ${{ runner.temp }}/screenshot-comment.md
          edit-mode: replace

      - name: Delete comment when no diff
        # 差分が無くなったら既存の比較結果コメントを削除する（解消が一目で分かるようにする）
        if: >
          steps.report.outputs.has_images == 'false' &&
          steps.fc.outputs.comment-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ steps.fc.outputs.comment-id }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID"

      - name: Cleanup outdated companion branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 2 週間以上更新の無い companion ブランチを削除する
          git fetch --depth=1 --no-tags origin \
            '+refs/heads/companion_pr_*:refs/remotes/origin/companion_pr_*'
          git branch -r --format="%(refname:lstrip=3)" | while IFS= read -r branch; do
            [[ "$branch" =~ ^companion_pr_[0-9]+_run_[0-9]+$ ]] || continue
            last_commit_date_timestamp=$(git log -1 --format=%ct "origin/$branch")
            now_timestamp=$(date +%s)
            if [ $((now_timestamp - last_commit_date_timestamp)) -gt 1209600 ]; then
               git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
                 push "https://github.com/$GITHUB_REPOSITORY.git" --delete "$branch"
            fi
          done
